<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Balón de Oro">
  <defs>
    <radialGradient id="bdo-ball" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#fff7d8"/>
      <stop offset="40%" stop-color="#f6d15c"/>
      <stop offset="76%" stop-color="#dd9e24"/>
      <stop offset="100%" stop-color="#96640f"/>
    </radialGradient>
    <linearGradient id="bdo-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c313a"/>
      <stop offset="100%" stop-color="#0d1015"/>
    </linearGradient>
    <linearGradient id="bdo-trim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8862f"/>
      <stop offset="50%" stop-color="#f6d15c"/>
      <stop offset="100%" stop-color="#b8862f"/>
    </linearGradient>
  </defs>

  <!-- pedestal -->
  <path d="M14.5 40 L33.5 40 L36.5 46 L11.5 46 Z" fill="url(#bdo-base)" stroke="#000" stroke-opacity="0.35" stroke-width="0.5"/>
  <rect x="11.5" y="45" width="25" height="1.8" rx="0.9" fill="url(#bdo-trim)"/>
  <!-- stem -->
  <path d="M21 35.5 L27 35.5 L25.6 40.4 L22.4 40.4 Z" fill="url(#bdo-base)"/>

  <!-- ball -->
  <circle cx="24" cy="19.5" r="15" fill="url(#bdo-ball)" stroke="#8a5a10" stroke-width="0.7"/>

  <!-- football panels: pentágono central + 5 costuras radiales (patrón clásico) -->
  <g opacity="0.5">
    <polygon points="24,14.5 28.76,17.95 26.94,23.55 21.06,23.55 19.24,17.95" fill="#7a5410"/>
    <g stroke="#7a5410" stroke-width="0.9" fill="none" stroke-linecap="round">
      <path d="M24 14.5 L24 7"/>
      <path d="M28.76 17.95 L34.8 15.7"/>
      <path d="M26.94 23.55 L30.7 29.6"/>
      <path d="M21.06 23.55 L17.3 29.6"/>
      <path d="M19.24 17.95 L13.2 15.7"/>
    </g>
  </g>

  <!-- highlight -->
  <ellipse cx="17.8" cy="13" rx="3.8" ry="2.4" fill="#ffffff" opacity="0.4"/>
</svg>
